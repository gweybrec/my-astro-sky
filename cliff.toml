# git-cliff configuration — Conventional Commits changelog for MyAstroSky.
# Docs: https://git-cliff.org/docs/configuration
# Local preview:  npm run changelog     (writes CHANGELOG.md)
#                 npx git-cliff --latest --strip header   (release-body preview)

[changelog]
# Markdown header written once at the top of CHANGELOG.md.
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated from [Conventional Commits](https://www.conventionalcommits.org)
by [git-cliff](https://git-cliff.org).

"""
# Rendered once per release. Tera template (indentation + trim is git-cliff's idiom).
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**[BREAKING]** {% endif %}\
            {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/gweybrec/my-astro-sky/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}
"""
footer = ""
# Trim leading/trailing whitespace from each line of the rendered body.
trim = true
# Collapse any run of 3+ blank lines left by empty sections into a single blank line.
postprocessors = [
  { pattern = '\\n{3,}', replace = "\\n\\n" },
]

[git]
# Parse commits per the Conventional Commits spec.
conventional_commits = true
# Drop commits that don't follow the spec (keeps the changelog clean).
filter_unconventional = true
# Process commits in reverse chronological order within a release.
filter_commits = false
# Match this repo's release tags (vX.Y.Z).
tag_pattern = "v[0-9]*"
# Sort newest tag first.
topo_order = false
sort_commits = "newest"

# Order of sections is set by the numeric HTML comment prefix in `group`,
# which the body template strips before rendering the heading.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^improvement", group = "<!-- 1 -->Improvements" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactor" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^style", group = "<!-- 7 -->Styling" },
  { message = "^build", group = "<!-- 8 -->Build System" },
  # Noise — never show these in the changelog.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  # Internal-only work (e.g. `internal(refactor):`) — real changes, but nothing a
  # user of the app would recognise, so they stay out of the release notes.
  { message = "^internal", skip = true },
  { message = "^Merge", skip = true },
  # Anything else conventional but unmapped.
  { message = ".*", group = "<!-- 9 -->Other" },
]
