<!-- @dsCard group="Mobile — proposed" height=240 subtitle="Proposed: title, search field and one action" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>TopBar — preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        padding: var(--space-7);
        display: flex;
        justify-content: center;
      }
      .col {
        width: 412px;
        max-width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--space-7);
      }
      .cap {
        margin-bottom: var(--space-2);
        color: var(--text-secondary);
      }
      .frame {
        border: 1px solid var(--border-panel);
        background: var(--bg-app);
      }
      .screen {
        height: var(--space-18);
      }
    </style>
  </head>
  <body>
    <div class="col">
      <div>
        <div class="cap m-caption">Title, search field, one action</div>
        <div class="frame">
          <header class="mob-topbar">
            <h1 class="mob-topbar-title m-title">Cibles</h1>
            <input
              class="mob-search m-body"
              type="search"
              placeholder="Rechercher M31, NGC 7000…"
              aria-label="Rechercher"
            />
            <button class="mob-icon-btn" aria-label="Trouver des cibles">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="8" />
                <circle
                  cx="12"
                  cy="12"
                  r="1.5"
                  fill="currentColor"
                  stroke="none"
                />
                <path d="M12 1 v3.5" />
                <path d="M12 19.5 v3.5" />
                <path d="M1 12 h3.5" />
                <path d="M19.5 12 h3.5" />
              </svg>
            </button>
          </header>
          <div class="screen"></div>
        </div>
      </div>
      <div>
        <div class="cap m-caption">Search focused, action selected</div>
        <div class="frame">
          <header class="mob-topbar">
            <h1 class="mob-topbar-title m-title">Cibles</h1>
            <input
              class="mob-search m-body"
              style="border-color: var(--border-focus)"
              type="search"
              value="M31"
              aria-label="Rechercher"
            />
            <button
              class="mob-icon-btn"
              aria-pressed="true"
              aria-label="Trouver des cibles"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="8" />
                <circle
                  cx="12"
                  cy="12"
                  r="1.5"
                  fill="currentColor"
                  stroke="none"
                />
                <path d="M12 1 v3.5" />
                <path d="M12 19.5 v3.5" />
                <path d="M1 12 h3.5" />
                <path d="M19.5 12 h3.5" />
              </svg>
            </button>
          </header>
          <div class="screen"></div>
        </div>
      </div>
    </div>
  </body>
</html>
