<!-- @dsCard group="Mobile — proposed" height=520 subtitle="Proposed: 56px row, leading icon, two lines, trailing value or chevron" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>ListRow — preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        padding: var(--space-7);
        display: flex;
        justify-content: center;
      }
      .col {
        width: 412px;
        max-width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--space-7);
      }
      .cap {
        margin-bottom: var(--space-2);
        color: var(--text-secondary);
      }
      .list {
        border: 1px solid var(--border-panel);
        background: var(--bg-panel);
      }
      /* static rendition of the pressed state */
      .mob-row.is-pressed {
        background: var(--bg-hover);
      }
    </style>
  </head>
  <body>
    <div class="col">
      <div>
        <div class="cap m-caption">Leading icon, two lines, trailing value</div>
        <div class="list">
          <button class="mob-row">
            <span class="mob-row-lead"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="8" />
                <circle
                  cx="12"
                  cy="12"
                  r="1.5"
                  fill="currentColor"
                  stroke="none"
                />
                <path d="M12 1 v3.5" />
                <path d="M12 19.5 v3.5" />
                <path d="M1 12 h3.5" />
                <path d="M19.5 12 h3.5" /></svg
            ></span>
            <span class="mob-row-body"
              ><span class="mob-row-title m-body">Galaxie d'Andromède</span
              ><span class="mob-row-sub m-secondary"
                >M31 · Galaxie spirale · AND</span
              ></span
            >
            <span class="mob-row-trail m-mono">58°</span>
          </button>
          <button class="mob-row is-pressed">
            <span class="mob-row-lead"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="8" />
                <circle
                  cx="12"
                  cy="12"
                  r="1.5"
                  fill="currentColor"
                  stroke="none"
                />
                <path d="M12 1 v3.5" />
                <path d="M12 19.5 v3.5" />
                <path d="M1 12 h3.5" />
                <path d="M19.5 12 h3.5" /></svg
            ></span>
            <span class="mob-row-body"
              ><span class="mob-row-title m-body">Nébuleuse d'Orion</span
              ><span class="mob-row-sub m-secondary"
                >M42 · Nébuleuse en émission · ORI</span
              ></span
            >
            <span class="mob-row-trail m-mono">41°</span>
          </button>
        </div>
      </div>
      <div>
        <div class="cap m-caption">Chevron: the row opens a detail screen</div>
        <div class="list">
          <button class="mob-row">
            <span class="mob-row-lead"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                />
                <path d="M14 2v6h6" />
                <path d="M7.5 12.5 9 14l2.5-2.5" />
                <path d="M13.5 13H17" />
                <path d="M7.5 17 9 18.5l2.5-2.5" />
                <path d="M13.5 17.5H17" /></svg
            ></span>
            <span class="mob-row-body"
              ><span class="mob-row-title m-body">Nuit du 03/10</span
              ><span class="mob-row-sub m-secondary">2 objets</span></span
            >
            <span class="mob-row-trail"
              ><span class="mob-row-chevron" aria-hidden="true">▶</span></span
            >
          </button>
          <button class="mob-row">
            <span class="mob-row-lead"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="9" cy="9" r="2" />
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></svg
            ></span>
            <span class="mob-row-body"
              ><span class="mob-row-title m-body">M31_2024.jpg</span
              ><span class="mob-row-sub m-secondary"
                >Placée sur la carte</span
              ></span
            >
            <span class="mob-row-trail"
              ><span class="mob-row-chevron" aria-hidden="true">▶</span></span
            >
          </button>
        </div>
      </div>
      <div>
        <div class="cap m-caption">
          One line, no icon: a setting with a value
        </div>
        <div class="list">
          <button class="mob-row">
            <span class="mob-row-body"
              ><span class="mob-row-title m-body">Thème</span></span
            >
            <span class="mob-row-trail m-secondary">Froid moderne</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
