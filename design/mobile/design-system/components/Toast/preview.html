<!-- @dsCard group="Desktop — from the code" height=250 subtitle="toast, toast-error, toast-warning, toast-undo" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Toast — preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        padding: var(--space-7);
      }
      /* the real #toast-container is fixed at the bottom centre of the window; here it is a plain column */
      #toast-container {
        position: static;
        transform: none;
        align-items: flex-start;
      }
      .toast {
        animation: none;
      }
    </style>
  </head>
  <body>
    <div id="toast-container">
      <div class="toast">Données supprimées avec succès</div>
      <div class="toast toast-error">
        Erreur de suppression : fichier introuvable
      </div>
      <div class="toast toast-warning">Aucune solution trouvée</div>
      <div class="toast toast-undo">
        <span>« M31_2024.jpg » supprimée</span
        ><button class="toast-action">Annuler</button>
      </div>
    </div>
  </body>
</html>
