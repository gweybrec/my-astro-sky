<!-- @dsCard group="Mobile — proposed" height=300 subtitle="Proposed: 2 to 4 exclusive options, 48px segments" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>SegmentedControl — preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        padding: var(--space-7);
        display: flex;
        justify-content: center;
      }
      .col {
        width: 412px;
        max-width: 100%;
        display: grid;
        gap: var(--space-7);
      }
      .cap {
        margin-bottom: var(--space-2);
        color: var(--text-secondary);
      }
      /* static rendition of the pressed state */
      .mob-seg-btn.is-pressed {
        background: var(--accent-fill-lg);
      }
    </style>
  </head>
  <body>
    <div class="col">
      <div>
        <div class="cap m-caption">Three options, "Moyenne" selected</div>
        <div class="mob-seg" role="radiogroup" aria-label="Distance Lune">
          <button class="mob-seg-btn m-body" role="radio" aria-checked="false">
            Proche
          </button>
          <button
            class="mob-seg-btn m-body-strong"
            role="radio"
            aria-checked="true"
          >
            Moyenne
          </button>
          <button class="mob-seg-btn m-body" role="radio" aria-checked="false">
            Éloignée
          </button>
        </div>
      </div>
      <div>
        <div class="cap m-caption">Two options, second one pressed</div>
        <div class="mob-seg" role="radiogroup" aria-label="Hémisphère">
          <button
            class="mob-seg-btn m-body-strong"
            role="radio"
            aria-checked="true"
          >
            Nord
          </button>
          <button
            class="mob-seg-btn m-body is-pressed"
            role="radio"
            aria-checked="false"
          >
            Sud
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
