name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check frontend
        run: npm run typecheck:client

      - name: Type-check server
        run: npm run typecheck:server

      # Warn-only: ESLint rules are all `warn`, so this surfaces issues in the log
      # without failing the build. See eslint.config.js / CLAUDE.md.
      - name: Lint
        run: npm run lint

      # Blocking: formatting is deterministic once the repo is Prettier-clean.
      - name: Prettier check
        run: npm run format:check

      - name: Build
        run: npx vite build
