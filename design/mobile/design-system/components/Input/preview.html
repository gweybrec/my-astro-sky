<!-- @dsCard group="Desktop — from the code" height=300 subtitle="input-base: rest, focus, disabled, error" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Input — preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        padding: var(--space-7);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, var(--panel-width));
        gap: var(--space-7) var(--space-9);
      }
      .cap {
        margin-bottom: var(--space-2);
        color: var(--text-secondary);
        font-size: var(--font-size-small);
      }
      /* static rendition of :focus; same declaration as .input-base:focus in bundle.css */
      .input-base.is-focus {
        border-color: var(--border-focus);
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div>
        <div class="cap">Rest, with label</div>
        <label class="input-label" for="i1">Rechercher étoile ou DSO</label>
        <input
          id="i1"
          class="input-base"
          type="text"
          placeholder="Rechercher M31, NGC 7000…"
        />
      </div>
      <div>
        <div class="cap">Focus</div>
        <label class="input-label" for="i2">Rechercher étoile ou DSO</label>
        <input id="i2" class="input-base is-focus" type="text" value="M31" />
      </div>
      <div>
        <div class="cap">Disabled</div>
        <label class="input-label" for="i3">Rechercher étoile ou DSO</label>
        <input id="i3" class="input-base" type="text" value="M31" disabled />
      </div>
      <div>
        <div class="cap">Error, required field</div>
        <label class="input-label" for="i4"
          >RA / Déc<span class="required-star"> *</span></label
        >
        <input
          id="i4"
          class="input-base input-error"
          type="text"
          value="99h 99m"
        />
        <div class="input-error-msg">Coordonnées invalides</div>
      </div>
    </div>
  </body>
</html>
