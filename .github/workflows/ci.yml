name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check frontend
        run: npm run typecheck:client

      - name: Type-check server
        run: npm run typecheck:server

      - name: Build
        run: npx vite build
