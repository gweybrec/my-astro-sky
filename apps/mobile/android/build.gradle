// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 8.13's default build-tools (35.0.0) is not installed on the development machine: pin every Android module
// (app and the Capacitor library modules) to the installed 37.0.0.
subprojects {
    plugins.withId('com.android.library') {
        extensions.configure(com.android.build.api.dsl.LibraryExtension) { it.buildToolsVersion = '37.0.0' }
    }
    plugins.withId('com.android.application') {
        extensions.configure(com.android.build.api.dsl.ApplicationExtension) { it.buildToolsVersion = '37.0.0' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
