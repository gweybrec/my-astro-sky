<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyAstroSky</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-app); color:var(--text-bright); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  /* the composition: a 480-wide box on the right half of the 960 layout, clear of the name */
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:528px; height:288px; }
  .accent { fill:var(--accent-color); }
  .tint { fill:var(--accent-fill-xl); }
  .ink { fill:var(--text-bright); }
  .star { fill:var(--target-rating-text); }
  .blk { rx:var(--radius-xl); }
  .plus { fill:var(--accent-color); }
  .plus.cut { fill:var(--bg-app); }
  /* name and tagline in flow, pinned by the block's bottom edge */
  .words { position:absolute; left:var(--space-9); right:var(--space-9); bottom:var(--space-9); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:72px; line-height:.95; font-weight:500; letter-spacing:-.01em; color:var(--text-bright); }
  .tag { margin:var(--space-4) 0 0 0; font-size:14px; line-height:20px; color:var(--text-secondary); }
</style>
</head>

<div class="cover">

  arrangement blocks snapped to a 10×6 lattice of space-14 cells, a tall slab at the left, the tint stepped down beside it, the pale field high at the right, space-2 inset from every lattice line
  pattern     plus grid, from "precise, technical, mono": a star-chart registration mark at every free lattice intersection, 1 mark per 48px, 45 in all; marks that land on a block are cut out in the ground colour
  scales      pitch space-14 (48px); inset space-2; mark arm space-4, thickness space-px; corners radius-xl on every block
