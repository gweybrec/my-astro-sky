<!-- @dsCard group="Desktop — from the code" height=210 subtitle="Native select with input-base, and the compact panel select" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Select — preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        padding: var(--space-7);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, var(--panel-width));
        gap: var(--space-7) var(--space-9);
      }
      .cap {
        margin-bottom: var(--space-2);
        color: var(--text-secondary);
        font-size: var(--font-size-small);
      }
      .field {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div>
        <div class="cap">input-base, in a modal form</div>
        <label class="input-label" for="s1">Thème</label>
        <select id="s1" class="input-base">
          <option>Froid moderne (défaut)</option>
          <option>Chaud</option>
          <option>Froid classique</option>
        </select>
      </div>
      <div>
        <div class="cap">input-base, disabled</div>
        <label class="input-label" for="s2">Langue</label>
        <select id="s2" class="input-base" disabled>
          <option>Français</option>
          <option>English</option>
          <option>Español</option>
          <option>Deutsch</option>
        </select>
      </div>
      <div>
        <div class="cap">display-controls-select, in a side-panel row</div>
        <div class="field">
          <select class="display-controls-select" aria-label="Style de tracé">
            <option>Occidental classique</option>
            <option>Stellarium</option>
            <option>H.A. Rey</option>
          </select>
        </div>
      </div>
    </div>
  </body>
</html>
