<!-- @dsCard group="Mobile — proposed" height=330 subtitle="Proposed: five tabs, active state, 56px high" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>TabBar — preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        padding: var(--space-7);
        display: flex;
        justify-content: center;
      }
      .col {
        width: 412px;
        max-width: 100%;
        display: grid;
        gap: var(--space-7);
      }
      .cap {
        margin-bottom: var(--space-2);
        color: var(--text-secondary);
      }
      .frame {
        border: 1px solid var(--border-panel);
        background: var(--bg-app);
      }
      .screen {
        height: var(--space-21);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
      }
      /* static rendition of the pressed state */
      .mob-tab.is-pressed .mob-tab-pill {
        background: var(--accent-fill-lg);
      }
    </style>
  </head>
  <body>
    <div class="col">
      <div>
        <div class="cap m-caption">Sky selected</div>
        <div class="frame">
          <div class="screen m-secondary">Carte du Ciel</div>
          <nav class="mob-tabbar" role="tablist" aria-label="Navigation">
            <button class="mob-tab" role="tab" aria-selected="true">
              <span class="mob-tab-pill"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="8" cy="8" r="6.5" />
                  <circle cx="8" cy="8" r="3.5" />
                  <circle
                    cx="8"
                    cy="8"
                    r="0.75"
                    fill="currentColor"
                    stroke="none"
                  /></svg
              ></span>
              <span class="m-caption">Ciel</span>
            </button>
            <button class="mob-tab" role="tab" aria-selected="false">
              <span class="mob-tab-pill"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <circle cx="9" cy="9" r="2" />
                  <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></svg
              ></span>
              <span class="m-caption">Galerie</span>
            </button>
            <button class="mob-tab" role="tab" aria-selected="false">
              <span class="mob-tab-pill"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="8" />
                  <circle
                    cx="12"
                    cy="12"
                    r="1.5"
                    fill="currentColor"
                    stroke="none"
                  />
                  <path d="M12 1 v3.5" />
                  <path d="M12 19.5 v3.5" />
                  <path d="M1 12 h3.5" />
                  <path d="M19.5 12 h3.5" /></svg
              ></span>
              <span class="m-caption">Cibles</span>
            </button>

                  viewBox="0 0 24 24"

                  stroke-linejoin="round"
                >

                  />
                  <path d="M14 2v6h6" />
                  <path d="M7.5 12.5 9 14l2.5-2.5" />

                  <path d="M7.5 17 9 18.5l2.5-2.5" />
