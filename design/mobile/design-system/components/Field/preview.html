<!-- @dsCard group="Mobile — proposed" height=560 subtitle="Proposed: 48px text field and select, label above" -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Field — preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        padding: var(--space-7);
        display: flex;
        justify-content: center;
      }
      .col {
        width: 412px;
        max-width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--space-7);
      }
      .cap {
        margin-bottom: var(--space-2);
        color: var(--text-secondary);
      }
      .pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-4);
        align-items: start;
      }
    </style>
  </head>
  <body>
    <div class="col">
      <div>
        <div class="cap m-caption">Label and text field</div>
        <label class="mob-field-label m-secondary" for="f1"
          >Recherche d'une cible</label
        >
        <input
          id="f1"
          class="mob-field m-body"
          type="text"
          placeholder="Rechercher M31, NGC 7000…"
        />
      </div>
      <div>
        <div class="cap m-caption">Label and select</div>
        <label class="mob-field-label m-secondary" for="f2"
          >Constellation</label
        >
        <div class="mob-select-wrap">
          <select id="f2" class="mob-select m-body">
            <option>Toutes</option>
            <option>Andromède</option>
            <option>Orion</option>
          </select>
        </div>
      </div>
      <div>
        <div class="cap m-caption">A field and a select side by side</div>
        <div class="pair">
          <div>
            <label class="mob-field-label m-secondary" for="f3">Nom</label>
            <input id="f3" class="mob-field m-body" type="text" value="M31" />
          </div>
          <div>
            <label class="mob-field-label m-secondary" for="f4">Type</label>
            <div class="mob-select-wrap">
              <select id="f4" class="mob-select m-body">
                <option>Nébuleuse planétaire</option>
                <option>Galaxie spirale</option>
                <option>Amas ouvert</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="cap m-caption">Disabled</div>
        <label class="mob-field-label m-secondary" for="f5">Catalogue</label>
        <input
          id="f5"
          class="mob-field m-body"
          type="text"
          value="Messier"
          disabled
        />
      </div>
    </div>
  </body>
</html>
